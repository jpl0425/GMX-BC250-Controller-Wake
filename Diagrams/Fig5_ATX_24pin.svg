nt-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">3</text><rect x="388" y="204" width="52" height="52" rx="8" fill="#1E9E3A" stroke="#333" stroke-width="4"/><text x="414" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">16</text><text x="414" y="192" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E9E3A">PS_ON</text><rect x="388" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="414" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">4</text><rect x="466" y="204" width="52" height="52" rx="8" fill="#222222" stroke="#333" stroke-width="4"/><text x="492" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">17</text><text x="492" y="192" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#222222">COM</text><rect x="466" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="492" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">5</text><rect x="544" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="570" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">18</text><rect x="544" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="570" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">6</text><rect x="622" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="648" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">19</text><rect x="622" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="648" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">7</text><rect x="700" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="726" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">20</text><rect x="700" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="726" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">8</text><rect x="778" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="804" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">21</text><rect x="778" y="282" width="52" height="52" rx="8" fill="#7B2FBE" stroke="#333" stroke-width="4"/><text x="804" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">9</text><text x="804" y="358" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#7B2FBE">+5VSB</text><rect x="856" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="882" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">22</text><rect x="856" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="882" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">10</text><rect x="934" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="960" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">23</text><rect x="934" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="960" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">11</text><rect x="1012" y="204" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="1038" y="237" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">24</text><rect x="1012" y="282" width="52" height="52" rx="8" fill="#CFD8DC" stroke="#333" stroke-width="1"/><text x="1038" y="315" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">12</text><text x="650.0" y="450" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Pin numbers for reference only - the view may be mirrored on yours. Clip-side row = pins 13-24.</text><text x="650.0" y="480" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" fill="#111">Easiest: go by wire colour - the single PURPLE wire (+5VSB) and the single GREEN wire (PS_ON).</text><text x="650.0" y="510" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle" fill="#111">Black wires next to the green one (pins 15 / 17) are ground.</text><text x="650.0" y="548" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#D32F2F">Use a 24-pin ATX breakout / female socket so you don't cut the power supply's cable.</text></svg>