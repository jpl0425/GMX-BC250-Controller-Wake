<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250"><rect width="1600" height="1250" fill="#fff"/><text x="800.0" y="40" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" fill="#111">BC-250  -  where to connect</text><rect x="30" y="70" width="760" height="560" rx="14" fill="#1F6F43" stroke="#0B3D24" stroke-width="3"/><text x="50" y="105" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="start" fill="#fff">A.  TPMS1 header  (top side of the board)</text><rect x="75" y="260" width="640" height="150" rx="6" fill="none" stroke="#fff" stroke-width="3"/><text x="85" y="455" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#fff">TPMS1</text><polygon points="65,410 85,400 85,420" fill="#fff"/><text x="200" y="452" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#fff" font-style="italic">&lt;- triangle = pin 1 end</text><rect x="85" y="285" width="30" height="30" fill="#111"/><rect x="94" y="294" width="12" height="12" fill="#D4AF37"/><rect x="85" y="355" width="30" height="30" fill="#111"/><rect x="94" y="364" width="12" height="12" fill="#D4AF37"/><rect x="155" y="285" width="30" height="30" fill="#111"/><rect x="164" y="294" width="12" height="12" fill="#D4AF37"/><rect x="155" y="355" width="30" height="30" fill="#111"/><rect x="164" y="364" width="12" height="12" fill="#D4AF37"/><rect x="225" y="285" width="30" height="30" fill="#111"/><rect x="234" y="294" width="12" height="12" fill="#D4AF37"/><rect x="225" y="355" width="30" height="30" fill="#111"/><rect x="234" y="364" width="12" height="12" fill="#D4AF37"/><rect x="295" y="285" width="30" height="30" fill="#111"/><rect x="304" y="294" width="12" height="12" fill="#D4AF37"/><rect x="295" y="355" width="30" height="30" fill="#111"/><rect x="304" y="364" width="12" height="12" fill="#D4AF37"/><rect x="365" y="285" width="30" height="30" fill="#111"/><rect x="374" y="294" width="12" height="12" fill="#FFEB3B"/><rect x="365" y="355" width="30" height="30" fill="#111"/><rect x="374" y="364" width="12" height="12" fill="#D4AF37"/><rect x="435" y="285" width="30" height="30" fill="#111"/><rect x="444" y="294" width="12" height="12" fill="#D4AF37"/><text x="450" y="274" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">skip</text><rect x="435" y="355" width="30" height="30" fill="#111"/><rect x="444" y="364" width="12" height="12" fill="#D4AF37"/><rect x="508" y="288" width="24" height="24" fill="none" stroke="#FFCC80" stroke-width="3" stroke-dasharray="5,4"/><text x="520" y="256" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFCC80">MISSING</text><text x="520" y="274" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFCC80">PIN</text><rect x="505" y="355" width="30" height="30" fill="#111"/><rect x="514" y="364" width="12" height="12" fill="#D4AF37"/><rect x="575" y="285" width="30" height="30" fill="#111"/><rect x="584" y="294" width="12" height="12" fill="#D4AF37"/><text x="590" y="274" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="middle" fill="#FFCC80">pin 15</text><rect x="575" y="355" width="30" height="30" fill="#111"/><rect x="584" y="364" width="12" height="12" fill="#D4AF37"/><rect x="645" y="285" width="30" height="30" fill="#111"/><rect x="654" y="294" width="12" height="12" fill="#D4AF37"/><rect x="645" y="355" width="30" height="30" fill="#111"/><rect x="654" y="364" width="12" height="12" fill="#D4AF37"/><circle cx="380" cy="300" r="26" fill="none" stroke="#FFEB3B" stroke-width="5"/><text x="380" y="266" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFEB3B">PIN 9</text><text x="50" y="150" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="start" fill="#fff">1. Find the MISSING pin (pin 13).</text><text x="50" y="174" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">2. In the SAME row, move toward the triangle end: skip one pin,</text><text x="50" y="198" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#FFEB3B">   the next one is PIN 9 = '3V'  -&gt;  goes to R3 (strip 5).</text><text x="50" y="480" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#fff">3. CHECK with a meter before soldering/connecting (PSU plugged in):</text><text x="70" y="504" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">BC-250 OFF  -&gt;  pin 9 reads 0 V</text><text x="70" y="528" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">BC-250 ON    -&gt;  pin 9 reads about 3.3 V</text><text x="70" y="552" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#FFCC80">If it reads 3.3 V while the PC is OFF, it is the wrong pin.</text><text x="50" y="612" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start" fill="#fff" font-style="italic">Drawn illustration - which row is on top may be mirrored on your board.</text><rect x="810" y="70" width="760" height="560" rx="14" fill="#1F6F43" stroke="#0B3D24" stroke-width="3"/><text x="830" y="105" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="start" fill="#fff">B.  AUTO_PWRON1 jumper  (top side, near battery)</text><rect x="988" y="308" width="44" height="44" fill="#111"/><rect x="1003" y="323" width="14" height="14" fill="#D4AF37"/><text x="1010" y="390" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">1</text><rect x="1068" y="308" width="44" height="44" fill="#111"/><rect x="1083" y="323" width="14" height="14" fill="#D4AF37"/><text x="1090" y="390" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">2</text><rect x="1148" y="308" width="44" height="44" fill="#111"/><rect x="1163" y="323" width="14" height="14" fill="#D4AF37"/><text x="1170" y="390" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">3</text><polygon points="960,382 980,372 980,392" fill="#fff"/><rect x="1056" y="290" width="148" height="80" rx="8" fill="#212121" stroke="#FFEB3B" stroke-width="5" opacity="0.92"/><text x="1130.0" y="336" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFEB3B">JUMPER</text><text x="1090" y="450" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">AUTO_PWRON1</text><text x="840" y="480" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#FFEB3B">Put the jumper on pins 2-3 (the two pins AWAY from the triangle).</text><text x="840" y="508" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">= 'wait for power button' mode.  Needed for BOTH wiring options.</text><text x="840" y="540" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">Pins 1-2 = board turns itself on whenever it gets 12 V</text><text x="840" y="564" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">(do NOT use that with this wake board).</text><rect x="30" y="650" width="1540" height="560" rx="14" fill="#1F6F43" stroke="#0B3D24" stroke-width="3"/><text x="50" y="685" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="start" fill="#fff">C.  Power-button pad + ground pad  (BOTTOM side of the board, rear edge)</text><text x="50" y="722" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#FFCC80">Drawn illustration, NOT a photo - exact pad positions may differ on your board.</text><text x="50" y="746" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">Reference photo: GitHub tfabris/BC-250, 'Power Button Solder Points'.  Pads can lift - use strain relief.</text><text x="50" y="770" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#fff">SOLDER only with the power supply UNPLUGGED from the wall.  Never let a probe touch two legs at once.</text><text x="50" y="820" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#FFEB3B">Find the power-button pad (meter on DC volts):</text><text x="60" y="850" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">1. PSU plugged in, BC-250 OFF, black probe on a USB shield (ground).</text><text x="60" y="874" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">2. Touch each leg of the power button with the red probe.</text><text x="60" y="898" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">3. Have a helper HOLD the real power button down.</text><text x="60" y="922" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#fff">4. The leg that drops to 0 V while held, and comes back</text><text x="60" y="946" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#fff">    when released, is the power-button pad  -&gt;  orange wire (Q1 drain).</text><text x="60" y="970" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#fff">    (The PC will start when the button is pressed - that is OK.)</text><rect x="30" y="1150" width="1540" height="60" fill="#B0BEC5"/><text x="800" y="1190" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">REAR EDGE  (I/O ports side)</text><rect x="120" y="1080" width="200" height="70" fill="#9E9E9E" stroke="#555" stroke-width="2"/><text x="220.0" y="1122" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">USB</text><rect x="360" y="1080" width="170" height="70" fill="#9E9E9E" stroke="#555" stroke-width="2"/><text x="445.0" y="1122" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">HDMI / DP</text><rect x="580" y="1080" width="200" height="70" fill="#9E9E9E" stroke="#555" stroke-width="2"/><text x="680.0" y="1122" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">USB</text><circle cx="680" cy="1040" r="18" fill="#C0C0C0" stroke="#666" stroke-width="3"/><circle cx="680" cy="1040" r="7" fill="#555"/><polyline points="662,1040 560,1040" fill="none" stroke="#222222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="1035" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="end" fill="#fff">ground pad</text><text x="550" y="1057" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="end" fill="#fff">(a USB shield leg) - black wire</text><rect x="915" y="1065" width="90" height="85" rx="8" fill="#ECEFF1" stroke="#555" stroke-width="2"/><circle cx="960" cy="1105" r="26" fill="#66BB6A" opacity="0.8"/><text x="960" y="1170" font-family="DejaVu Sans" font-size="1" font-weight="normal" text-anchor="start" fill="#111"></text><text x="905" y="1100" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="end" fill="#fff">POWER (green)</text><rect x="1115" y="1065" width="90" height="85" rx="8" fill="#ECEFF1" stroke="#555" stroke-width="2"/><circle cx="1160" cy="1105" r="26" fill="#42A5F5" opacity="0.8"/><text x="1160" y="1170" font-family="DejaVu Sans" font-size="1" font-weight="normal" text-anchor="start" fill="#111"></text><text x="1215" y="1100" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" fill="#fff">RESET (blue)</text><circle cx="925" cy="1000" r="14" fill="#C0C0C0" stroke="#666" stroke-width="2"/><circle cx="925" cy="1000" r="5" fill="#555"/><circle cx="995" cy="1000" r="14" fill="#C0C0C0" stroke="#666" stroke-width="2"/><circle cx="995" cy="1000" r="5" fill="#555"/><circle cx="925" cy="940" r="14" fill="#C0C0C0" stroke="#666" stroke-width="2"/><circle cx="925" cy="940" r="5" fill="#555"/><circle cx="995" cy="940" r="14" fill="#C0C0C0" stroke="#666" stroke-width="2"/><circle cx="995" cy="940" r="5" fill="#555"/><rect x="895" y="910" width="130" height="120" rx="8" fill="none" stroke="#FFEB3B" stroke-width="4" stroke-dasharray="10,6"/><polyline points="1025,970 1110,970" fill="none" stroke="#EF6C00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1120" y="950" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#FFEB3B">Power-button legs (solder joints</text><text x="1120" y="972" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#FFEB3B">behind the green-lit button).</text><text x="1120" y="996" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#fff">There may be extra legs for the</text><text x="1120" y="1018" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#fff">button's LED - use the meter test.</text></svg>