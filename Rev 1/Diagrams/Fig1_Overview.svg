<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#fff"/><text x="800.0" y="40" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" fill="#111">How it works  -  overview</text><rect x="60" y="120" width="360" height="200" rx="10" fill="#F4F6F8" stroke="#222222" stroke-width="3"/><rect x="60" y="120" width="360" height="34" rx="10" fill="#222222"/><rect x="60" y="140" width="360" height="14" fill="#222222"/><text x="240.0" y="144" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">Flex ATX power supply</text><text x="70" y="178" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">24-pin plug: +5VSB, GND, PS_ON</text><text x="70" y="200" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">PCIe 8-pin -&gt; BC-250 J1000</text><text x="70" y="222" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">(stays plugged in at the wall)</text><rect x="620" y="120" width="360" height="200" rx="10" fill="#F4F6F8" stroke="#2E7D32" stroke-width="3"/><rect x="620" y="120" width="360" height="34" rx="10" fill="#2E7D32"/><rect x="620" y="140" width="360" height="14" fill="#2E7D32"/><text x="800.0" y="144" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">Wake board</text><text x="630" y="178" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">Pico W  or  Pico 2 W</text><text x="630" y="200" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">Q1 + Q2 MOSFETs, D1, R1-R3</text><text x="630" y="222" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">listens for the controller</text><rect x="1180" y="120" width="360" height="200" rx="10" fill="#F4F6F8" stroke="#EF6C00" stroke-width="3"/><rect x="1180" y="120" width="360" height="34" rx="10" fill="#EF6C00"/><rect x="1180" y="140" width="360" height="14" fill="#EF6C00"/><text x="1360.0" y="144" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">AMD BC-250</text><text x="1190" y="178" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">power-button pad + ground</text><text x="1190" y="200" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">TPMS1 pin 9 'PC on' 3.3 V</text><text x="1190" y="222" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">AUTO_PWRON1 on pins 2-3</text><rect x="620" y="480" width="360" height="170" rx="10" fill="#F4F6F8" stroke="#1565C0" stroke-width="3"/><rect x="620" y="480" width="360" height="34" rx="10" fill="#1565C0"/><rect x="620" y="500" width="360" height="14" fill="#1565C0"/><text x="800.0" y="504" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">Xbox Series X|S controller</text><text x="630" y="538" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">already paired to the BC-250</text><text x="630" y="560" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">sends a Bluetooth LE 'hello'</text><text x="630" y="582" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start" fill="#111">when you switch it on</text><polyline points="420,180 620,180" fill="none" stroke="#7B2FBE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="168" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#7B2FBE">+5VSB  (power)</text><polyline points="420,230 620,230" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="220" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">GND</text><polyline points="620,280 420,280" fill="none" stroke="#1E9E3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14,8"/><text x="520" y="302" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E9E3A">PS_ON  (Option B only)</text><polyline points="980,180 1180,180" fill="none" stroke="#EF6C00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="168" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#EF6C00">presses power button</text><polyline points="980,230 1180,230" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="220" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">GND</text><polyline points="1180,280 980,280" fill="none" stroke="#C9A400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="302" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#C9A400">'PC is on' signal</text><polyline points="800,480 800,320" fill="none" stroke="#1565C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,8"/><text x="815" y="410" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#1565C0">Bluetooth LE (listen only)</text><polyline points="980,565 1360,565 1360,320" fill="none" stroke="#1565C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,8"/><text x="1375" y="450" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#1565C0">normal connection</text><text x="1375" y="472" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" fill="#1565C0">to the BC-250</text><text x="60" y="400" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#111">Sequence when you switch the controller on:</text><text x="60" y="432" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#111">1. Pico hears a SAVED controller</text><text x="60" y="460" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#111">2. PS_ON on (Option B), wait 1 s</text><text x="60" y="488" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#111">3. 'press' power button 0.5 s</text><text x="60" y="516" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#111">4. wait for the 'PC is on' signal</text><text x="60" y="544" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" fill="#111">5. controller connects to BC-250</text></svg>