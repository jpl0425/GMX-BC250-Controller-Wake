<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="na"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="na"/></feMerge>
  </filter>
  <filter id="brushed" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.6" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="na"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="na"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="6" dy="8" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="3" dy="4" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="pcblight" cx="35%" cy="30%" r="85%">
    <stop offset="0" stop-color="#2a8a4c"/><stop offset="0.6" stop-color="#1d6c3b"/><stop offset="1" stop-color="#13502a"/>
  </radialGradient>
  <radialGradient id="solder" cx="38%" cy="35%" r="65%">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#d9dde0"/><stop offset="0.7" stop-color="#8d969c"/><stop offset="1" stop-color="#5b6368"/>
  </radialGradient>
  <radialGradient id="copper" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#f6c48a"/><stop offset="0.6" stop-color="#d9894a"/><stop offset="1" stop-color="#a85f2a"/>
  </radialGradient>
  <radialGradient id="hole" cx="50%" cy="55%" r="60%">
    <stop offset="0" stop-color="#3b2a20"/><stop offset="0.8" stop-color="#140e0a"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff4b8"/><stop offset="0.45" stop-color="#e2b84a"/><stop offset="1" stop-color="#9c7420"/>
  </linearGradient>
  <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3a3a"/><stop offset="0.15" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0b0b0b"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9ecee"/><stop offset="0.5" stop-color="#bfc5c9"/><stop offset="1" stop-color="#8e969b"/>
  </linearGradient>
  <linearGradient id="nickel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3f4f5"/><stop offset="0.5" stop-color="#b9bec2"/><stop offset="1" stop-color="#7d858a"/>
  </linearGradient>
  <radialGradient id="lightpipe" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.5" stop-color="#dfe9ee" stop-opacity="0.75"/><stop offset="1" stop-color="#9fb3bd" stop-opacity="0.8"/>
  </radialGradient>
  <linearGradient id="nylon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f1e8"/><stop offset="0.5" stop-color="#e2ddcf"/><stop offset="1" stop-color="#c5bfae"/>
  </linearGradient>
  <linearGradient id="nylonblack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b3b3b"/><stop offset="0.5" stop-color="#232323"/><stop offset="1" stop-color="#121212"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e3c39a"/><stop offset="1" stop-color="#caa273"/>
  </linearGradient>
</defs>
<rect width="1600" height="760" fill="url(#table)"/><rect x="0" y="0" width="1600" height="86" fill="#0f1a14" fill-opacity="0.93"/><text x="28" y="40" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="start" fill="#ffffff">Bazzite: make 'Sleep' shut down instead (the BC-250 can't wake from sleep)</text><text x="28" y="72" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" fill="#c8e6c9">Open a terminal on the BC-250 (Desktop Mode -&gt; Konsole) and type these two lines.</text><g filter="url(#shadow)"><rect x="120" y="140" width="1360" height="470" rx="12" fill="#1e1f22"/></g><rect x="120" y="140" width="1360" height="44" rx="12" fill="#2d2f33"/><text x="800" y="170" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#ccc">Terminal</text><circle cx="150" cy="162" r="9" fill="#ff5f57"/><circle cx="178" cy="162" r="9" fill="#febc2e"/><circle cx="206" cy="162" r="9" fill="#28c840"/><text x="150" y="240" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#e0e0e0">$ sudo ln -sf /usr/lib/systemd/system/poweroff.target /etc/systemd/system/suspend.target</text><text x="150" y="286" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#9e9e9e">[sudo] password:            &lt;- type your password (nothing shows), press Enter</text><text x="150" y="332" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#e0e0e0">$ sudo systemctl daemon-reload</text><text x="150" y="378" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#e0e0e0"></text><text x="150" y="424" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#81c784"># To undo later:</text><text x="150" y="470" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#bdbdbd">$ sudo rm /etc/systemd/system/suspend.target</text><text x="150" y="516" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="start" fill="#bdbdbd">$ sudo systemctl daemon-reload</text><rect x="0" y="716" width="1600" height="44" fill="#0f1a14" fill-opacity="0.9"/><text x="800.0" y="745" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="middle" fill="#ffe082">Commands from the tfabris/BC-250 and elektricm BC-250 guides; not re-tested for this project.</text></svg>