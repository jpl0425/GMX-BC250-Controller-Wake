<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs>
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="na"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="na"/></feMerge>
  </filter>
  <filter id="brushed" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.6" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="na"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="na"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="6" dy="8" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="3" dy="4" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="pcblight" cx="35%" cy="30%" r="85%">
    <stop offset="0" stop-color="#2a8a4c"/><stop offset="0.6" stop-color="#1d6c3b"/><stop offset="1" stop-color="#13502a"/>
  </radialGradient>
  <radialGradient id="solder" cx="38%" cy="35%" r="65%">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#d9dde0"/><stop offset="0.7" stop-color="#8d969c"/><stop offset="1" stop-color="#5b6368"/>
  </radialGradient>
  <radialGradient id="copper" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#f6c48a"/><stop offset="0.6" stop-color="#d9894a"/><stop offset="1" stop-color="#a85f2a"/>
  </radialGradient>
  <radialGradient id="hole" cx="50%" cy="55%" r="60%">
    <stop offset="0" stop-color="#3b2a20"/><stop offset="0.8" stop-color="#140e0a"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff4b8"/><stop offset="0.45" stop-color="#e2b84a"/><stop offset="1" stop-color="#9c7420"/>
  </linearGradient>
  <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3a3a"/><stop offset="0.15" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0b0b0b"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e9ecee"/><stop offset="0.5" stop-color="#bfc5c9"/><stop offset="1" stop-color="#8e969b"/>
  </linearGradient>
  <linearGradient id="nickel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3f4f5"/><stop offset="0.5" stop-color="#b9bec2"/><stop offset="1" stop-color="#7d858a"/>
  </linearGradient>
  <radialGradient id="lightpipe" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.5" stop-color="#dfe9ee" stop-opacity="0.75"/><stop offset="1" stop-color="#9fb3bd" stop-opacity="0.8"/>
  </radialGradient>
  <linearGradient id="nylon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f1e8"/><stop offset="0.5" stop-color="#e2ddcf"/><stop offset="1" stop-color="#c5bfae"/>
  </linearGradient>
  <linearGradient id="nylonblack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b3b3b"/><stop offset="0.5" stop-color="#232323"/><stop offset="1" stop-color="#121212"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e3c39a"/><stop offset="1" stop-color="#caa273"/>
  </linearGradient>
</defs>
<rect width="1700" height="900" fill="url(#table)"/><rect x="0" y="0" width="1700" height="86" fill="#0f1a14" fill-opacity="0.93"/><text x="28" y="40" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="start" fill="#ffffff">Solder the SMD parts onto their adapter boards</text><text x="28" y="72" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start" fill="#c8e6c9">Flux, a fine tip and tweezers.  Check each MOSFET with the meter before it goes on the perfboard.</text><g filter="url(#shadow)"><rect x="220.0" y="200.0" width="208.0" height="240.0" rx="4" fill="#1e4fa8"/></g><circle cx="260.0" cy="240.0" r="24.0" fill="url(#solder)"/><text x="296.0" y="244.0" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" fill="#ffffff">1</text><circle cx="260.0" cy="320.0" r="24.0" fill="url(#solder)"/><text x="296.0" y="324.0" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" fill="#ffffff">2</text><circle cx="260.0" cy="400.0" r="24.0" fill="url(#solder)"/><text x="296.0" y="404.0" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="start" fill="#ffffff">3</text><rect x="350.4" y="284.0" width="51.2" height="72.0" rx="2" fill="url(#plastic)"/><rect x="332.0" y="297.0" width="20.0" height="6" fill="url(#nickel)"/><rect x="332.0" y="337.0" width="20.0" height="6" fill="url(#nickel)"/><rect x="400.0" y="317.0" width="20.0" height="6" fill="url(#nickel)"/><text x="344.0" y="428.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Q1 / Q2</text><text x="490.0" y="247.0" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#1565C0">1 = GATE</text><text x="490.0" y="327.0" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#111">2 = SOURCE</text><text x="490.0" y="407.0" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#EF6C00">3 = DRAIN</text><g transform="rotate(200 266.0 320.0)" filter="url(#shadow)"><polygon points="266.0,320.0 292.0,316.0 292.0,324.0" fill="url(#nickel)"/><rect x="292.0" y="311.0" width="126.50000000000001" height="18" rx="6" fill="#D32F2F"/><rect x="418.5" y="306.0" width="14" height="28" rx="4" fill="#D32F2F"/><rect x="432.5" y="309.0" width="92.0" height="22" rx="8" fill="#D32F2F"/><rect x="296.0" y="313.0" width="115.0" height="4" rx="2" fill="#fff" opacity="0.25"/></g><g transform="rotate(160 266.0 404.0)" filter="url(#shadow)"><polygon points="266.0,404.0 292.0,400.0 292.0,408.0" fill="url(#nickel)"/><rect x="292.0" y="395.0" width="126.50000000000001" height="18" rx="6" fill="#1b1b1b"/><rect x="418.5" y="390.0" width="14" height="28" rx="4" fill="#1b1b1b"/><rect x="432.5" y="393.0" width="92.0" height="22" rx="8" fill="#1b1b1b"/><rect x="296.0" y="397.0" width="115.0" height="4" rx="2" fill="#fff" opacity="0.25"/></g><rect x="40" y="560" width="420" height="174" rx="10" fill="#101418" fill-opacity="0.92" stroke="#FFE000" stroke-width="3"/><text x="54" y="590" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#FFE000">METER CHECK (diode mode)</text><text x="54" y="618" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">RED probe on pin 2 (Source)</text><text x="54" y="640" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">BLACK probe on pin 3 (Drain)</text><text x="54" y="662" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">= roughly 0.4 - 0.9 (built-in diode)</text><text x="54" y="684" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">Reversed probes = open / OL.</text><text x="54" y="706" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">Nothing like this? Chip is rotated</text><text x="54" y="728" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">or the adapter numbers differ.</text><g filter="url(#shadow)"><rect x="890.0" y="200.0" width="112.0" height="280.0" rx="4" fill="#1e4fa8"/></g><circle cx="925.0" cy="235.0" r="21.0" fill="url(#solder)"/><circle cx="925.0" cy="445.0" r="21.0" fill="url(#solder)"/><rect x="949.5" y="313.4" width="28.0" height="53.2" fill="#1c1c1c"/><rect x="949.5" y="313.4" width="28.0" height="11.200000000000001" fill="url(#nickel)"/><rect x="949.5" y="355.4" width="28.0" height="11.200000000000001" fill="url(#nickel)"/><text x="1006.0" y="345.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="start" fill="#1a237e">R1 / R2 / R3</text><rect x="760" y="560" width="420" height="130" rx="10" fill="#101418" fill-opacity="0.92" stroke="#80DEEA" stroke-width="3"/><text x="774" y="590" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#80DEEA">RESISTOR ADAPTERS</text><text x="774" y="618" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">10k may be marked 103 or 01C</text><text x="774" y="640" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">1k may be marked 102 or 01B</text><text x="774" y="662" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">(many 0603s are unmarked - measure)</text><text x="774" y="684" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">No direction - either way round.</text><g filter="url(#shadow)"><rect x="1250.0" y="300.0" width="280.0" height="112.0" rx="4" fill="#1e4fa8"/></g><circle cx="1285.0" cy="335.0" r="21.0" fill="url(#solder)"/><circle cx="1495.0" cy="335.0" r="21.0" fill="url(#solder)"/><rect x="1362.0" y="356.0" width="56.0" height="35.0" rx="2" fill="#222"/><rect x="1404.0" y="356.0" width="8.4" height="35.0" fill="#e0e0e0"/><text x="1390.0" y="428.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a237e">D1</text><circle cx="1495.0" cy="335.0" r="30" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="9"/><circle cx="1495.0" cy="335.0" r="30" fill="none" stroke="#FFE000" stroke-width="5" filter="url(#glow)"/><rect x="1220" y="560" width="420" height="130" rx="10" fill="#101418" fill-opacity="0.92" stroke="#FFB74D" stroke-width="3"/><text x="1234" y="590" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#FFB74D">DIODE ADAPTER (D1)</text><text x="1234" y="618" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">Painted BAND = cathode.</text><text x="1234" y="640" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">Mark the adapter pin on the</text><text x="1234" y="662" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">band side with a pen: that pin</text><text x="1234" y="684" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start" fill="#ffffff">goes toward the Pico (VSYS).</text><rect x="0" y="856" width="1700" height="44" fill="#0f1a14" fill-opacity="0.9"/><text x="850.0" y="885" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="middle" fill="#ffe082">Resistor marking codes vary by maker - if unsure, measure: 10k = about 10.0 k, 1k = about 1.0 k on the ohms range.</text></svg>