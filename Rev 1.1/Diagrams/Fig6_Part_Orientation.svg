<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520"><rect width="1300" height="520" fill="#fff"/><text x="650.0" y="40" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" fill="#111">Part orientation  (surface-mount parts)</text><rect x="210" y="244" width="80" height="52" rx="5" fill="#333" stroke="#000" stroke-width="2"/><circle cx="222" cy="284" r="4" fill="#ddd"/><rect x="244" y="228" width="12" height="16" fill="#BDBDBD" stroke="#555"/><rect x="222" y="296" width="12" height="16" fill="#BDBDBD" stroke="#555"/><rect x="266" y="296" width="12" height="16" fill="#BDBDBD" stroke="#555"/><text x="250" y="276" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">Q</text><text x="300" y="240" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" fill="#111">Q = BSS138LT1G</text><text x="300" y="260" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="start" fill="#111" font-style="italic">(top view)</text><text x="262" y="222" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="start" fill="#EF6C00">3 Drain</text><text x="216" y="332" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="end" fill="#1565C0">1 Gate</text><text x="284" y="332" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="start" fill="#222">2 Source</text><text x="250" y="420" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" fill="#111" font-style="italic">Printed marking on top is usually 'J1' + date code.</text><text x="250" y="445" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" fill="#111">1 pin on one side (3 = Drain), 2 pins on the other.</text><rect x="768" y="246" width="64" height="28" rx="4" fill="#333"/><rect x="818" y="246" width="10" height="28" fill="#E0E0E0"/><polygon points="786,251 786,269 806,260" fill="#fff"/><line x1="807" y1="251" x2="807" y2="269" stroke="#fff" stroke-width="3"/><text x="800" y="236" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">D1  1N5819WS</text><text x="764" y="298" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="end" fill="#111">anode</text><text x="836" y="298" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="start" fill="#111">band = cathode</text><text x="800" y="340" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" fill="#111">SOD-323: the painted BAND end is the cathode.</text><text x="800" y="365" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#D32F2F">Band end points TOWARD the Pico (VSYS).</text><text x="650.0" y="470" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="middle" fill="#333" font-style="italic">Tip: tack SOT-23 parts onto a SOT-23-to-DIP adapter or solder thin wires to them directly.</text></svg>